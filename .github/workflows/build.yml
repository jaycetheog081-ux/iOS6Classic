name: Build iOS 6 Classic Theme

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build rootful Debian package
        shell: bash
        run: |
          set -euo pipefail

          PKG="com.pelican.ios6classic"
          ROOT="package"
          THEME="$ROOT/Library/Themes/iOS6Classic.theme"

          mkdir -p "$THEME/IconBundles"
          mkdir -p "$ROOT/DEBIAN"
          mkdir -p dist

          cp control "$ROOT/DEBIAN/control"
          cp layout/Library/Themes/iOS6Classic.theme/Info.plist "$THEME/Info.plist"

          dpkg-deb --build "$ROOT" "dist/${PKG}_1.0.0_iphoneos-arm.deb"

          echo "Package created:"
          ls -lh dist/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: iOS6Classic-rootful-deb
          path: dist/*.deb
          if-no-files-found: error
